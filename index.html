<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Admin - Pabrik Berita v3.0 | Diskominfo Merangin</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;width:600px;height:600px;top:-120px;left:-120px;background:radial-gradient(circle,rgba(212,175,55,0.12) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;width:700px;height:700px;bottom:-150px;right:-100px;background:radial-gradient(circle,rgba(212,175,55,0.12) 0%,transparent 70%);pointer-events:none;z-index:0}
.card{width:400px;max-width:92vw;background:#fff;border-radius:24px;border-top:4px solid #D4AF37;box-shadow:0 25px 60px rgba(0,0,0,.45),0 0 0 1px rgba(212,175,55,.15),0 0 30px rgba(212,175,55,.12);padding:32px 28px 24px;position:relative;z-index:1;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.header{text-align:center;margin-bottom:20px}
.header h1{font-size:20px;font-weight:800;color:#111;letter-spacing:-.02em;line-height:1.2}
.header p{font-size:13px;color:#6b7280;margin-top:4px;font-weight:500}
.logo-wrap{display:flex;justify-content:center;margin:18px 0 14px;position:relative}
.logo-img{width:88px;height:88px;border-radius:50%;border:3px solid #D4AF37;box-shadow:0 0 0 4px rgba(212,175,55,.15),0 8px 24px rgba(212,175,55,.35);object-fit:cover;background:#fff;display:block}
.fallback{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#D4AF37,#b8960c);border:3px solid #D4AF37;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(212,175,55,.15),0 8px 24px rgba(212,175,55,.35);position:relative}
.fallback::before{content:'';position:absolute;inset:8px;background:#fff;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);border-radius:4px}
.fallback span{position:relative;z-index:1;font-weight:900;font-size:20px;color:#8a6d00;letter-spacing:.5px}
.ver{text-align:center;font-size:11px;color:#9ca3af;margin-bottom:22px;letter-spacing:.2px}
.form{display:flex;flex-direction:column;gap:14px}
.input-group{position:relative}
.input-group label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
.input-group input{width:100%;height:46px;padding:0 44px 0 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;background:#fafafa;outline:none;transition:.2s}
.input-group input:focus{border-color:#D4AF37;background:#fff;box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.eye{position:absolute;right:10px;top:30px;width:32px;height:32px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;border-radius:8px}
.eye:hover{background:#f3f4f6;color:#111}
.btn{height:48px;background:#0a0a0a;color:#D4AF37;border:1.5px solid #D4AF37;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:.3px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn:hover{background:#111;box-shadow:0 6px 20px rgba(212,175,55,.25);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 12px;border-radius:10px;font-size:12px;display:none;line-height:1.4}
.error.show{display:block}
.footer{text-align:center;margin-top:18px;font-size:10px;color:#9ca3af;line-height:1.4}
</style>
</head>
<body>
<div class="card">
<div class="header">
<h1>Super Admin</h1>
<p>Diskominfo Kabupaten Merangin</p>
</div>
<div class="logo-wrap">
<img id="mainLogo" class="logo-img" src="logo.png" alt="Golden Circular Logo" onerror="this.style.display='none';document.getElementById('fallback-logo').style.display='flex'">
<div id="fallback-logo" class="fallback"><span>AMD</span></div>
</div>
<div class="ver">Ver Pabrik Berita v3.0 - develop by Agung Maydaryus</div>
<div id="err" class="error"></div>
<form class="form" id="loginForm" autocomplete="off">
<div class="input-group">
<label>Email / Username</label>
<input type="text" id="user" placeholder="agungmaydaryus / editor@meranginkab.go.id" required>
</div>
<div class="input-group">
<label>Password</label>
<input type="password" id="pass" placeholder="••••••••" required>
<button type="button" class="eye" id="toggleEye" aria-label="Toggle password">👁</button>
</div>
<button type="submit" class="btn">✦ Masuk</button>
</form>
<div class="footer">© 2026 Diskominfo Merangin • Golden Circular Premium<br>Secure login • No auto-login</div>
</div>
<script>
const USERS={'agungmaydaryus':'@Karimun2019!','agung maydaryus':'@Karimun2019!','editor@meranginkab.go.id':'Editor2026!','editor':'Editor2026!','peliput@meranginkab.go.id':'Peliput2026!','peliput':'Peliput2026!'};
const EXCLUDED=['admin@meranginkab.go.id','agung.maydaryus@meranginkab.go.id','admin'];
const form=document.getElementById('loginForm');
const userEl=document.getElementById('user');
const passEl=document.getElementById('pass');
const errEl=document.getElementById('err');
const eye=document.getElementById('toggleEye');
eye.onclick=()=>{const t=passEl.type==='password';passEl.type=t?'text':'password';eye.textContent=t?'🙈':'👁';};
function showError(m){errEl.textContent=m;errEl.classList.add('show');}
form.onsubmit=(e)=>{
e.preventDefault();
const u=userEl.value.trim();
const p=passEl.value;
const key=u.toLowerCase();
if(!u||!p){showError('Email/Username dan Password wajib diisi.');return;}
if(EXCLUDED.includes(key)){showError('Akun '+u+' dinonaktifkan. Hubungi Super Admin.');return;}
if(USERS[key]&&USERS[key]===p){
localStorage.setItem('isLoggedIn','true');
localStorage.setItem('currentUser',u);
localStorage.setItem('loginAt',new Date().toISOString());
location.href='dashboard.html';
}else{
showError('Login gagal. Periksa username & password. Pastikan bukan akun excluded.');
}
};
</script>
</body>
</html>
